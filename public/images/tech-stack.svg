<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" width="100%" height="auto" style="border-radius: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Gradients -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e599" />
      <stop offset="100%" stop-color="#00a86b" />
    </linearGradient>

    <linearGradient id="reactGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61dafb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="sarvamGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="drizzleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9f99d" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="976" height="226" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Decorative Header Bar -->
  <g transform="translate(24, 20)">
    <!-- Status Dot -->
    <circle cx="8" cy="10" r="4.5" fill="#10b981" />
    <circle cx="8" cy="10" r="8" fill="#10b981" opacity="0.25" />
    
    <text x="26" y="14" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.08em" text-transform="uppercase">
      MEDRELLA HEALTHCARE · PRODUCTION STACK &amp; ARCHITECTURE
    </text>

    <!-- Top Right Chip -->
    <rect x="800" y="0" width="132" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="866" y="14" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">VERIFIED 489 TESTS</text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="52" x2="956" y2="52" stroke="#1e293b" stroke-width="1" />

  <!-- ROW 1 (5 Cards) -->
  <g transform="translate(24, 66)">
    <!-- Card 1: Next.js -->
    <g transform="translate(0, 0)">
      <rect width="176" height="66" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      <!-- Next.js Icon -->
      <circle cx="28" cy="33" r="15" fill="#000000" stroke="#475569" stroke-width="1" />
      <path d="M21 40 L21 26 L32 40 L35 40 L35 26 L32 26 L32 37 L23 26 Z" fill="#ffffff" />
      <!-- Labels -->
      <text x="52" y="28" fill="#f8fafc" font-size="13" font-weight="700">Next.js</text>
      <rect x="108" y="16" width="56" height="18" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="0.8" />
      <text x="136" y="29" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">v16.4</text>
      <text x="52" y="47" fill="#94a3b8" font-size="10.5">Turbopack · App</text>
    </g>

    <!-- Card 2: React 19 -->
    <g transform="translate(189, 0)">
      <rect width="176" height="66" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      <!-- React Icon -->
      <circle cx="28" cy="33" r="15" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <ellipse cx="28" cy="33" rx="10" ry="4" fill="none" stroke="#61dafb" stroke-width="1.2" transform="rotate(30 28 33)" />
      <ellipse cx="28" cy="33" rx="10" ry="4" fill="none" stroke="#61dafb" stroke-width="1.2" transform="rotate(90 28 33)" />
      <ellipse cx="28" cy="33" rx="10" ry="4" fill="none" stroke="#61dafb" stroke-width="1.2" transform="rotate(150 28 33)" />
      <circle cx="28" cy="33" r="1.8" fill="#61dafb" />
      <!-- Labels -->
      <text x="52" y="28" fill="#f8fafc" font-size="13" font-weight="700">React</text>
      <rect x="96" y="16" width="68" height="18" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#61dafb" stroke-width="0.8" />
      <text x="130" y="29" fill="#61dafb" font-size="10.5" font-weight="700" text-anchor="middle">v19 RC</text>
      <text x="52" y="47" fill="#94a3b8" font-size="10.5">Server Actions</text>
    </g>

    <!-- Card 3: TypeScript -->
    <g transform="translate(378, 0)">
      <rect width="176" height="66" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      <!-- TS Icon -->
      <rect x="14" y="19" width="28" height="28" rx="5" fill="#3178c6" />
      <text x="28" y="38" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">TS</text>
      <!-- Labels -->
      <text x="52" y="28" fill="#f8fafc" font-size="13" font-weight="700">TypeScript</text>
      <rect x="126" y="16" width="38" height="18" rx="4" fill="#3178c6" fill-opacity="0.2" stroke="#3178c6" stroke-width="0.8" />
      <text x="145" y="29" fill="#60a5fa" font-size="10.5" font-weight="700" text-anchor="middle">v5</text>
      <text x="52" y="47" fill="#94a3b8" font-size="10.5">Strict Type Safe</text>
    </g>

    <!-- Card 4: Tailwind CSS -->
    <g transform="translate(567, 0)">
      <rect width="176" height="66" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      <!-- Tailwind Icon -->
      <circle cx="28" cy="33" r="15" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
      <path d="M21 33 C22.5 30 25 29 27 30 C29 31 30 33 32 33 C33.5 33 34.5 32 35 31 C34.5 33.5 32.5 35 30 35 C28 35 27 33 25 33 C23.5 33 22 34 21 35 Z" fill="#38bdf8" />
      <!-- Labels -->
      <text x="52" y="28" fill="#f8fafc" font-size="13" font-weight="700">Tailwind</text>
      <rect x="114" y="16" width="50" height="18" rx="4" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="0.8" />
      <text x="139" y="29" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">v4.0</text>
      <text x="52" y="47" fill="#94a3b8" font-size="10.5">Modern Engine</text>
    </g>

    <!-- Card 5: Drizzle ORM -->
    <g transform="translate(756, 0)">
      <rect width="176" height="66" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      <!-- Drizzle Icon -->
      <rect x="14" y="19" width="28" height="28" rx="6" fill="#1e293b" stroke="#84cc16" stroke-width="1" />
      <path d="M22 37 L28 23 M26 37 L32 23 M30 37 L36 23" stroke="#a3e635" stroke-width="2" stroke-linecap="round" />
      <!-- Labels -->
      <text x="52" y="28" fill="#f8fafc" font-size="13" font-weight="700">Drizzle</text>
      <rect x="104" y="16" width="60" height="18" rx="4" fill="#84cc16" fill-opacity="0.2" stroke="#84cc16" stroke-width="0.8" />
      <text x="134" y="29" fill="#bef264" font-size="10.5" font-weight="700" text-anchor="middle">ORM</text>
      <text x="52" y="47" fill="#94a3b8" font-size="10.5">Zero-cost Query</text>
    </g>
  </g>

  <!-- ROW 2 (4 Wider Cards) -->
  <g transform="translate(24, 144)">
    <!-- Card 6: Neon Postgres -->
    <g transform="translate(0, 0)">
      <rect width="224" height="66" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      <!-- Neon Icon -->
      <rect x="14" y="19" width="28" height="28" rx="6" fill="#022c22" stroke="#00e599" stroke-width="1" />
      <circle cx="28" cy="33" r="7" fill="none" stroke="#00e599" stroke-width="2.2" stroke-dasharray="32 10" />
      <!-- Labels -->
      <text x="52" y="28" fill="#f8fafc" font-size="13" font-weight="700">Neon PostgreSQL</text>
      <rect x="164" y="16" width="48" height="18" rx="4" fill="#00e599" fill-opacity="0.15" stroke="#00e599" stroke-width="0.8" />
      <text x="188" y="29" fill="#00e599" font-size="10" font-weight="700" text-anchor="middle">CLOUD</text>
      <text x="52" y="47" fill="#94a3b8" font-size="10.5">Advisory Locks · Pooler</text>
    </g>

    <!-- Card 7: Razorpay -->
    <g transform="translate(244, 0)">
      <rect width="224" height="66" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      <!-- Razorpay Icon -->
      <rect x="14" y="19" width="28" height="28" rx="6" fill="#0c1938" stroke="#3b82f6" stroke-width="1" />
      <path d="M24 39 L31 23 L28 29 L33 29 L26 43 Z" fill="#3b82f6" />
      <!-- Labels -->
      <text x="52" y="28" fill="#f8fafc" font-size="13" font-weight="700">Razorpay Gateway</text>
      <rect x="160" y="16" width="52" height="18" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="0.8" />
      <text x="186" y="29" fill="#60a5fa" font-size="10" font-weight="700" text-anchor="middle">ACTIVE</text>
      <text x="52" y="47" fill="#94a3b8" font-size="10.5">Tiered Refunds · Hold</text>
    </g>

    <!-- Card 8: Sarvam AI Agent -->
    <g transform="translate(488, 0)">
      <rect width="224" height="66" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      <!-- Sarvam Icon -->
      <rect x="14" y="19" width="28" height="28" rx="6" fill="#2c1404" stroke="#f97316" stroke-width="1" />
      <circle cx="28" cy="33" r="5" fill="#f97316" />
      <path d="M28 23 L28 26 M28 40 L28 43 M18 33 L21 33 M35 33 L38 33" stroke="#fb923c" stroke-width="1.8" stroke-linecap="round" />
      <!-- Labels -->
      <text x="52" y="28" fill="#f8fafc" font-size="13" font-weight="700">Sarvam AI Assistant</text>
      <rect x="166" y="16" width="46" height="18" rx="4" fill="#ea580c" fill-opacity="0.2" stroke="#f97316" stroke-width="0.8" />
      <text x="189" y="29" fill="#fb923c" font-size="10" font-weight="700" text-anchor="middle">VOICE</text>
      <text x="52" y="47" fill="#94a3b8" font-size="10.5">Multilingual · VAD Guard</text>
    </g>

    <!-- Card 9: Vercel Production -->
    <g transform="translate(732, 0)">
      <rect width="200" height="66" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      <!-- Vercel Icon -->
      <circle cx="28" cy="33" r="15" fill="#000000" stroke="#475569" stroke-width="1" />
      <polygon points="28,24 36,38 20,38" fill="#ffffff" />
      <!-- Labels -->
      <text x="52" y="28" fill="#f8fafc" font-size="13" font-weight="700">Vercel Cloud</text>
      <rect x="136" y="16" width="52" height="18" rx="4" fill="#ffffff" fill-opacity="0.1" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="162" y="29" fill="#f1f5f9" font-size="10" font-weight="700" text-anchor="middle">LIVE 200</text>
      <text x="52" y="47" fill="#94a3b8" font-size="10.5">Edge · SSL · HTTPS</text>
    </g>
  </g>
</svg>